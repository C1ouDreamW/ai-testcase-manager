[project]
name = "aitc-backend"
version = "0.1.0"
description = "AITC - AI 测试用例生成与管理平台后端"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb==1.5.9",
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "jieba==0.42.1",
    "langchain-chroma==1.1.0",
    "langchain-core==1.5.0",
    "langchain-openai==1.3.5",
    "langgraph==1.2.9",
    "langgraph-checkpoint-sqlite==3.1.0",
    "openpyxl==3.1.5",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "pypdf2==3.0.1",
    "python-docx==1.1.2",
    "python-multipart==0.0.20",
    "pyyaml==6.0.2",
    "rank-bm25==0.2.2",
    "sqlalchemy==2.0.36",
    "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "ruff>=0.15.21",
]

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["F821"]
"app/database.py" = ["F401"]
